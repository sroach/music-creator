[package]
name = "music-creator"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["tokio", "multipart"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
id3 = "1"
base64 = "0.23.1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
foundation-models = { version = "0.12", features = ["macos_26_0"] }
tokio-stream = "0.1"
passkey-auth = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
cookie = { version = "0.18", features = ["secure"] }
