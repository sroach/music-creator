<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Accepted Videos</title>
    <style>
        /* ===== Design Tokens ===== */
        :root {
            --color-primary: #3B82F6;
            --color-primary-hover: #2563EB;
            --color-success: #16A34A;
            --color-success-bg: #F0FDF4;
            --color-success-border: #BBF7D0;
            --color-surface: #FFFFFF;
            --color-surface-secondary: #F9FAFB;
            --color-text: #111827;
            --color-text-secondary: #4B5563;
            --color-text-tertiary: #6B7280;
            --color-border: #E5E7EB;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-lg: 24px;
            --font-size-xl: 30px;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-normal);
            color: var(--color-text);
            background-color: var(--color-surface-secondary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Layout ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-6) var(--space-5);
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            margin-bottom: var(--space-6);
        }

        .header h1 {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
            letter-spacing: -0.025em;
        }

        .header .subtitle {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-top: var(--space-1);
        }

        .header .count-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
            color: var(--color-success);
            background: var(--color-success-bg);
            border: 1px solid var(--color-success-border);
            border-radius: var(--radius-sm);
            padding: 2px var(--space-2);
            margin-top: var(--space-2);
        }

        /* ===== Video List ===== */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .video-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: box-shadow 0.15s ease;
        }

        .video-card:hover {
            box-shadow: var(--shadow-md);
        }

        .video-card-inner {
            display: flex;
            gap: var(--space-4);
            padding: var(--space-4);
        }

        .video-thumbnail {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: var(--color-surface-secondary);
            border: 1px solid var(--color-border);
        }

        .video-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .video-title {
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-base);
            color: var(--color-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-artist {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-top: var(--space-1);
        }

        .video-date {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
            margin-top: auto;
            padding-top: var(--space-2);
        }

        .video-player-wrapper {
            padding: 0 var(--space-4) var(--space-4);
        }

        .video-player-wrapper video {
            width: 100%;
            border-radius: var(--radius-sm);
            outline: none;
            background: #000;
            max-height: 400px;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            color: var(--color-text-tertiary);
            padding: var(--space-6);
            font-size: var(--font-size-sm);
        }

        .empty-state svg {
            margin-bottom: var(--space-3);
            opacity: 0.4;
        }

        /* ===== Loading State ===== */
        .loading-state {
            text-align: center;
            color: var(--color-text-tertiary);
            padding: var(--space-6);
            font-size: var(--font-size-sm);
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: var(--space-3);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .container {
                padding: var(--space-4);
            }

            .video-card-inner {
                flex-direction: column;
            }

            .video-thumbnail {
                width: 100%;
                height: 180px;
            }

            .video-player-wrapper video {
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Accepted Videos</h1>
            <p class="subtitle">Finalized music videos, ready to share</p>
            <div id="countBadge" class="count-badge" style="display: none;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span id="countText"></span>
            </div>
        </header>

        <div id="videoList" class="video-list">
            <div class="loading-state">
                <div class="spinner"></div>
                <div>Loading videos...</div>
            </div>
        </div>
    </div>

    <script>
        const videoList = document.getElementById('videoList');
        const countBadge = document.getElementById('countBadge');
        const countText = document.getElementById('countText');

        function formatDate(dateStr) {
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch {
                return dateStr;
            }
        }

        function renderVideos(songs) {
            const acceptedWithVideo = songs.filter(s => s.accepted === true && s.mp4_filename != null);

            if (acceptedWithVideo.length === 0) {
                videoList.innerHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        </svg>
                        <div>No accepted videos yet.</div>
                        <div style="margin-top: var(--space-1);">Songs need to be accepted and converted to video first.</div>
                    </div>
                `;
                countBadge.style.display = 'none';
                return;
            }

            countBadge.style.display = 'inline-flex';
            countText.textContent = acceptedWithVideo.length + ' video' + (acceptedWithVideo.length !== 1 ? 's' : '');

            videoList.innerHTML = acceptedWithVideo.map(song => {
                const safeName = song.mp4_filename.replace('.mp4', '');
                const thumbnailSrc = 'accepted/' + safeName + '.png';
                const videoSrc = 'accepted/' + song.mp4_filename;

                return `
                    <div class="video-card">
                        <div class="video-card-inner">
                            <img class="video-thumbnail" src="${thumbnailSrc}" alt="${song.song_name}" onerror="this.style.display='none'">
                            <div class="video-content">
                                <div class="video-title">${song.song_name}</div>
                                <div class="video-artist">${song.artist}</div>
                                <div class="video-date">${formatDate(song.created_at)}</div>
                            </div>
                        </div>
                        <div class="video-player-wrapper">
                            <video controls preload="metadata" poster="${thumbnailSrc}" onerror="this.removeAttribute('poster')">
                                <source src="${videoSrc}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadVideos() {
            try {
                const response = await fetch('list');
                const songs = await response.json();
                renderVideos(songs);
            } catch (err) {
                console.error('Failed to load videos:', err);
                videoList.innerHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <div>Failed to load videos.</div>
                        <div style="margin-top: var(--space-1);">Please check your connection and try again.</div>
                    </div>
                `;
            }
        }

        loadVideos();
    </script>
</body>
</html>
