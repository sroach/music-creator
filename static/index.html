<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Music Creator</title>
    <style>
        /* ===== Design Tokens ===== */
        :root {
            /* Colors */
            --color-primary: #3B82F6;
            --color-primary-hover: #2563EB;
            --color-primary-active: #1D4ED8;
            --color-secondary: #8B5CF6;
            --color-success: #16A34A;
            --color-success-bg: #F0FDF4;
            --color-success-border: #BBF7D0;
            --color-warning: #D97706;
            --color-warning-bg: #FFFBEB;
            --color-warning-border: #FDE68A;
            --color-danger: #DC2626;
            --color-danger-bg: #FEF2F2;
            --color-danger-border: #FECACA;
            --color-surface: #FFFFFF;
            --color-surface-secondary: #F9FAFB;
            --color-text: #111827;
            --color-text-secondary: #4B5563;
            --color-text-tertiary: #6B7280;
            --color-border: #E5E7EB;
            --color-border-hover: #D1D5DB;

            /* Typography */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-md: 18px;
            --font-size-lg: 24px;
            --font-size-xl: 30px;
            --font-size-2xl: 36px;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;

            /* Spacing */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;

            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-normal);
            color: var(--color-text);
            background-color: var(--color-surface-secondary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Layout ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-6) var(--space-5);
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            margin-bottom: var(--space-6);
        }

        .header h1 {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
            margin-bottom: var(--space-2);
            letter-spacing: -0.025em;
        }

        .header .subtitle {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            font-weight: var(--font-weight-normal);
        }

        /* ===== Card ===== */
        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            box-shadow: var(--shadow-sm);
        }

        /* ===== Form ===== */
        .form-group {
            margin-bottom: var(--space-5);
        }

        label {
            display: block;
            margin-bottom: var(--space-2);
            font-weight: var(--font-weight-medium);
            color: var(--color-text);
            font-size: var(--font-size-sm);
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: var(--font-size-base);
            font-family: var(--font-family);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:hover,
        input[type="number"]:hover,
        textarea:hover {
            border-color: var(--color-border-hover);
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        .hint {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
            margin-top: var(--space-1);
        }

        /* ===== Buttons ===== */
        .btn {
            display: block;
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: var(--color-primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-semibold);
            font-family: var(--font-family);
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .btn:hover {
            background: var(--color-primary-hover);
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .btn:active {
            background: var(--color-primary-active);
            transform: scale(0.98);
        }

        .btn:disabled {
            background: var(--color-border);
            color: var(--color-text-tertiary);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-2) var(--space-3);
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            font-family: var(--font-family);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: var(--color-surface-secondary);
            border-color: var(--color-border-hover);
            color: var(--color-text);
        }

        .btn-secondary:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .btn-accent {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-2) var(--space-3);
            background: transparent;
            border: 1px solid var(--color-secondary);
            border-radius: var(--radius-sm);
            color: var(--color-secondary);
            text-decoration: none;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            font-family: var(--font-family);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            white-space: nowrap;
        }

        .btn-accent:hover {
            background: rgba(139, 92, 246, 0.08);
            border-color: var(--color-secondary);
        }

        .btn-accent:focus-visible {
            outline: 2px solid var(--color-secondary);
            outline-offset: 2px;
        }

        .btn-accent:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-accent svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ===== Status Messages ===== */
        .status {
            margin-top: var(--space-5);
            padding: var(--space-4);
            border-radius: var(--radius-sm);
            text-align: center;
            display: none;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
        }

        .status[role="status"] {
            display: block;
        }

        .status.loading {
            background: var(--color-warning-bg);
            border: 1px solid var(--color-warning-border);
            color: var(--color-warning);
        }

        .status.success {
            background: var(--color-success-bg);
            border: 1px solid var(--color-success-border);
            color: var(--color-success);
        }

        .status.error {
            background: var(--color-danger-bg);
            border: 1px solid var(--color-danger-border);
            color: var(--color-danger);
        }

        /* ===== Media Players ===== */
        audio {
            width: 100%;
            max-width: 400px;
            height: 48px;
            border-radius: var(--radius-sm);
            outline: none;
        }

        video {
            width: 100%;
            max-width: 320px;
            border-radius: var(--radius-sm);
            outline: none;
            background: var(--color-surface-secondary);
        }

        .play-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--space-3);
            margin-top: var(--space-3);
            width: 100%;
        }

        .play-section .song-player-card {
            width: 100%;
        }

        .play-section .song-actions {
            width: 100%;
        }

        .play-section .song-actions .btn-secondary,
        .play-section .song-actions .btn-accent {
            flex: 1;
            justify-content: center;
        }

        /* ===== Spinner ===== */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(217, 119, 6, 0.3);
            border-top-color: var(--color-warning);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: var(--space-2);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Songs Section ===== */
        .songs-section {
            margin-top: var(--space-6);
        }

        .songs-section h2 {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text);
            margin-bottom: var(--space-4);
            letter-spacing: -0.025em;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .song-item {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-4) var(--space-5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-4);
            transition: box-shadow 0.15s ease;
        }

        .song-item:hover {
            box-shadow: var(--shadow-md);
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-base);
            color: var(--color-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-meta {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-top: var(--space-1);
        }

        .song-play {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--space-3);
            flex-shrink: 0;
        }

        .song-player-card {
            background: var(--color-surface-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: var(--space-3);
            width: 288px;
        }

        .song-player-card audio {
            width: 100%;
            height: 40px;
        }

        .song-player-card video {
            width: 100%;
            border-radius: var(--radius-sm);
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            width: 288px;
        }

        .song-actions .btn-secondary,
        .song-actions .btn-accent {
            flex: 1;
            justify-content: center;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            color: var(--color-text-tertiary);
            padding: var(--space-6);
            font-size: var(--font-size-sm);
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .container {
                padding: var(--space-4) var(--space-4);
            }

            .card {
                padding: var(--space-4);
            }

            .row {
                grid-template-columns: 1fr;
            }

            .song-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .song-play {
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
            }

            .song-player-card {
                width: 100%;
            }

            .song-actions {
                width: 100%;
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Music Creator</h1>
            <p class="subtitle">Generate songs with AI — powered by ACEMusic</p>
        </header>

        <div class="card">
            <form id="generateForm">
                <div class="form-group">
                    <label for="songName">Song Name</label>
                    <input type="text" id="songName" name="song_name" placeholder="My Awesome Song" required>
                </div>

                <div class="form-group">
                    <label for="artist">Artist</label>
                    <input type="text" id="artist" name="artist" value="AI Generated" placeholder="Artist name">
                </div>

                <div class="form-group">
                    <label for="prompt">Style Prompt</label>
                    <textarea id="prompt" name="prompt" rows="3" placeholder="e.g. indie pop, soft male vocal, warm acoustic guitar, dreamy synth pads, 100 BPM" required></textarea>
                    <p class="hint">Describe the music style, instrumentation, vocal type, and mood.</p>
                </div>

                <div class="form-group">
                    <label for="lyrics">Lyrics</label>
                    <textarea id="lyrics" name="lyrics" rows="12" placeholder="[verse]&#10;Write your lyrics here...&#10;&#10;[chorus]&#10;Your chorus here..." required></textarea>
                    <p class="hint">Use section tags like [verse], [chorus], [bridge], [outro].</p>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="duration">Duration (seconds)</label>
                        <input type="number" id="duration" name="duration" value="180" min="30" max="600">
                    </div>
                    <div class="form-group">
                        <label for="bpm">BPM</label>
                        <input type="number" id="bpm" name="bpm" value="120" min="40" max="240">
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">Generate Song</button>
            </form>

            <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>

        <section class="songs-section">
            <h2>Generated Songs</h2>
            <div id="songList" class="song-list">
                <div class="empty-state">No songs generated yet.</div>
            </div>
        </section>
    </div>

    <script>
        const form = document.getElementById('generateForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const songList = document.getElementById('songList');
        let existingSongs = [];

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function showStatus(type, message) {
            status.className = 'status ' + type;
            status.setAttribute('role', 'status');
            status.innerHTML = message;
        }

        function hideStatus() {
            status.className = 'status';
            status.removeAttribute('role');
            status.innerHTML = '';
        }

        async function loadSongs() {
            try {
                const response = await fetch('list');
                const songs = await response.json();
                existingSongs = songs;

                if (songs.length === 0) {
                    songList.innerHTML = '<div class="empty-state">No songs generated yet.</div>';
                    return;
                }

                songList.innerHTML = songs.map(song => {
                    const hasMp4 = song.mp4_filename != null;
                    const audioDownload = `<a href="download/${song.filename}" class="btn-secondary" download="${song.filename}">
                                    <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-6 2h12v2H6z"/></svg>
                                    Download Audio
                                </a>`;
                    let playerHtml = '';
                    let videoActions = '';
                    if (hasMp4) {
                        playerHtml = `<div class="song-player-card">
                            <video controls preload="none" src="download/${song.mp4_filename}?t=${song.created_at}"></video>
                        </div>`;
                        videoActions = `<a href="download/${song.mp4_filename}" class="btn-secondary" download="${song.mp4_filename}">
                                    <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-6 2h12v2H6z"/></svg>
                                    Download Video
                                </a>`;
                    } else {
                        playerHtml = `<div class="song-player-card">
                            <audio controls preload="none" src="download/${song.filename}?t=${song.created_at}"></audio>
                        </div>`;
                        videoActions = `<button class="btn-accent" data-convert="${song.filename}" title="Convert to video">
                                    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                                    Convert
                                </button>`;
                    }
                    return `
                    <div class="song-item">
                        <div class="song-info">
                            <div class="song-title">${song.song_name}</div>
                            <div class="song-meta">
                                ${song.artist} · ${formatFileSize(song.file_size_bytes)} · ${formatDate(song.created_at)}
                            </div>
                        </div>
                        <div class="song-play">
                            ${playerHtml}
                            <div class="song-actions">
                                ${audioDownload}
                                ${videoActions}
                            </div>
                        </div>
                    </div>
                `;
                }).join('');

                // Attach event listeners to convert buttons
                songList.querySelectorAll('[data-convert]').forEach(button => {
                    button.addEventListener('click', function() {
                        convertToVideo(this.dataset.convert, this);
                    });
                });
            } catch (err) {
                console.error('Failed to load songs:', err);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                song_name: document.getElementById('songName').value.trim(),
                artist: document.getElementById('artist').value.trim() || 'AI Generated',
                prompt: document.getElementById('prompt').value.trim(),
                lyrics: document.getElementById('lyrics').value.trim(),
                duration: parseInt(document.getElementById('duration').value) || 180,
                bpm: parseInt(document.getElementById('bpm').value) || 120
            };

            // Check if song name already exists
            const existingSong = existingSongs.find(s => s.song_name === payload.song_name);
            if (existingSong) {
                const confirmed = confirm(
                    `"${payload.song_name}" already exists. This will overwrite the existing song. Continue?`
                );
                if (!confirmed) {
                    return;
                }
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';
            showStatus('loading', '<span class="spinner"></span> Generating your song...');

            try {
                const response = await fetch('generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    const now = Date.now();
                    showStatus('success', `
                        Song generated successfully.<br>
                        <div class="play-section">
                            <div class="song-player-card">
                                <audio controls autoplay preload="none" src="download/${result.filename}?t=${now}"></audio>
                            </div>
                            <div class="song-actions">
                                <a href="download/${result.filename}" class="btn-secondary" download="${result.filename}">
                                    <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-6 2h12v2H6z"/></svg>
                                    Download
                                </a>
                                <button class="btn-accent" data-convert="${result.filename}" title="Convert to video">
                                    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                                    Convert
                                </button>
                            </div>
                        </div>
                    `);
                    // Attach convert button listener in success area
                    status.querySelector('[data-convert]').addEventListener('click', function() {
                        convertToVideo(this.dataset.convert, this);
                    });
                    // Refresh the song list
                    loadSongs();
                } else {
                    showStatus('error', result.error || 'Generation failed');
                }
            } catch (err) {
                showStatus('error', 'Network error: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Song';
            }
        });

        // Load songs on page load
        loadSongs();

        async function convertToVideo(filename, button) {
            const originalText = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<span class="spinner"></span> Converting...';

            try {
                const response = await fetch('convert/' + encodeURIComponent(filename), {
                    method: 'POST',
                });

                const result = await response.json();

                if (response.ok) {
                    // Refresh the song list to update the persistent view
                    loadSongs();
                } else {
                    button.innerHTML = originalText;
                    button.disabled = false;
                    showStatus('error', 'Conversion failed: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                button.innerHTML = originalText;
                button.disabled = false;
                showStatus('error', 'Network error: ' + err.message);
            }
        }
    </script>
</body>
</html>
