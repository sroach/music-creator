<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Edit Song - Music Creator</title>
    <style>
        :root {
            --color-primary: #3B82F6;
            --color-primary-hover: #2563EB;
            --color-success: #16A34A;
            --color-success-bg: #F0FDF4;
            --color-success-border: #BBF7D0;
            --color-danger: #DC2626;
            --color-danger-bg: #FEF2F2;
            --color-danger-border: #FECACA;
            --color-surface: #FFFFFF;
            --color-surface-secondary: #F9FAFB;
            --color-text: #111827;
            --color-text-secondary: #4B5563;
            --color-text-tertiary: #6B7280;
            --color-border: #E5E7EB;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-lg: 24px;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            color: var(--color-text);
            background-color: var(--color-surface-secondary);
            min-height: 100vh;
            line-height: 1.5;
        }
        .page-header {
            padding: var(--space-4) var(--space-5);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-header h1 {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            letter-spacing: -0.025em;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background-color 0.15s;
            text-decoration: none;
        }
        .btn-primary { background: var(--color-primary); color: white; }
        .btn-primary:hover { background: var(--color-primary-hover); }
        .btn-primary:disabled { background: var(--color-border); cursor: not-allowed; }
        .btn-ghost {
            background: transparent;
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
        }
        .btn-ghost:hover { background: var(--color-surface-secondary); }
        .container { max-width: 700px; margin: 0 auto; padding: var(--space-6) var(--space-5); }
        .form-group { margin-bottom: var(--space-4); }
        .form-group label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            margin-bottom: var(--space-2);
        }
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: var(--space-3);
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-group textarea { min-height: 120px; resize: vertical; font-family: monospace; }
        .form-group .hint {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
            margin-top: var(--space-1);
        }
        .file-upload {
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-sm);
            padding: var(--space-5);
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .file-upload:hover { border-color: var(--color-primary); }
        .file-upload input { display: none; }
        .file-upload .file-name {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-top: var(--space-2);
        }
        .status {
            padding: var(--space-3);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-4);
            display: none;
        }
        .status.success {
            display: block;
            background: var(--color-success-bg);
            border: 1px solid var(--color-success-border);
            color: var(--color-success);
        }
        .status.error {
            display: block;
            background: var(--color-danger-bg);
            border: 1px solid var(--color-danger-border);
            color: var(--color-danger);
        }
        .section-title {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--color-border);
        }
        .song-info {
            background: var(--color-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: var(--space-4);
            margin-bottom: var(--space-5);
        }
        .song-info h2 {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--space-2);
        }
        .song-info p {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
        }
        .loading { text-align: center; padding: var(--space-6); color: var(--color-text-tertiary); }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>✏️ Edit Song</h1>
        <a href="dashboard" class="btn btn-ghost">← Back</a>
    </div>
    <div class="container">
        <div id="status" class="status"></div>
        <div id="content">
            <div class="loading">Loading song details...</div>
        </div>
    </div>

    <script>
        const FILENAME = '{{FILENAME}}';

        function showFileName(input, targetId) {
            const target = document.getElementById(targetId);
            if (input.files.length > 0) {
                target.textContent = input.files[0].name;
            } else {
                target.textContent = '';
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        async function loadSong() {
            try {
                const resp = await fetch(`../song/${encodeURIComponent(FILENAME + '.mp3')}`);
                if (!resp.ok) throw new Error('Song not found');
                const song = await resp.json();

                document.getElementById('content').innerHTML = `
                    <div class="song-info">
                        <h2>${escapeHtml(song.song_name)}</h2>
                        <p>By ${escapeHtml(song.artist)}</p>
                    </div>

                    <form id="editForm" onsubmit="update(event)">
                        <div class="section-title">Replace Files</div>
                        <p class="hint" style="margin-bottom: var(--space-4);">Select a file to replace the existing one. Leave empty to keep the current file.</p>

                        <div class="form-group">
                            <label>Replace MP3</label>
                            <label class="file-upload" for="mp3File">
                                <input type="file" id="mp3File" name="mp3" accept=".mp3,audio/mpeg" onchange="showFileName(this, 'mp3Name')">
                                <div>📁 Select new MP3 file</div>
                                <div id="mp3Name" class="file-name"></div>
                            </label>
                        </div>

                        <div class="form-group">
                            <label>Replace PNG Thumbnail</label>
                            <label class="file-upload" for="pngFile">
                                <input type="file" id="pngFile" name="png" accept=".png,image/png" onchange="showFileName(this, 'pngName')">
                                <div>🖼️ Select new PNG image</div>
                                <div id="pngName" class="file-name"></div>
                            </label>
                        </div>

                        <div class="section-title">Update Metadata</div>

                        <div class="form-group">
                            <label for="jsonContent">JSON Metadata</label>
                            <textarea id="jsonContent" rows="10">${escapeHtml(song.prompt ? JSON.stringify({
                                song_name: song.song_name,
                                artist: song.artist,
                                prompt: song.prompt,
                                lyrics: song.lyrics
                            }, null, 2) : '')}</textarea>
                            <p class="hint">Edit the JSON metadata and click "Update Metadata" to save changes.</p>
                        </div>

                        <div style="display: flex; gap: var(--space-3);">
                            <button type="submit" id="submitBtn" class="btn btn-primary" style="flex: 1;">
                                💾 Update Files
                            </button>
                            <button type="button" class="btn btn-ghost" onclick="updateMetadata()">
                                📝 Update Metadata
                            </button>
                        </div>
                    </form>
                `;
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="loading">Error: ${escapeHtml(err.message)}</div>`;
            }
        }

        async function update(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Updating...';

            const formData = new FormData();

            const mp3File = document.getElementById('mp3File').files[0];
            if (mp3File) formData.append('mp3', mp3File);

            const pngFile = document.getElementById('pngFile').files[0];
            if (pngFile) formData.append('png', pngFile);

            if (formData.keys().next().done) {
                showStatus('Please select at least one file to update.', 'error');
                btn.disabled = false;
                btn.textContent = '💾 Update Files';
                return;
            }

            try {
                const resp = await fetch(`song/${encodeURIComponent(FILENAME + '.mp3')}`, {
                    method: 'PUT',
                    body: formData
                });

                if (!resp.ok) {
                    if (resp.status === 401) {
                        window.location.href = 'login';
                        return;
                    }
                    const err = await resp.json();
                    throw new Error(err.error || 'Update failed');
                }

                const result = await resp.json();
                showStatus('✅ ' + result.message, 'success');
                document.getElementById('mp3File').value = '';
                document.getElementById('pngFile').value = '';
                document.getElementById('mp3Name').textContent = '';
                document.getElementById('pngName').textContent = '';

            } catch (err) {
                showStatus('❌ ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 Update Files';
            }
        }

        async function updateMetadata() {
            const jsonContent = document.getElementById('jsonContent').value;
            if (!jsonContent.trim()) {
                showStatus('JSON content is empty.', 'error');
                return;
            }

            try {
                // Validate JSON
                JSON.parse(jsonContent);
            } catch (e) {
                showStatus('Invalid JSON: ' + e.message, 'error');
                return;
            }

            const formData = new FormData();
            formData.append('json', new Blob([jsonContent], { type: 'application/json' }), 'metadata.json');

            try {
                const resp = await fetch(`song/${encodeURIComponent(FILENAME + '.mp3')}`, {
                    method: 'PUT',
                    body: formData
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || 'Update failed');
                }

                showStatus('✅ Metadata updated successfully.', 'success');

            } catch (err) {
                showStatus('❌ ' + err.message, 'error');
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        loadSong();
    </script>
</body>
</html>
