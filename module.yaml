product: jvm/app

settings:
  ktor: enabled
  kotlin:
    serialization: enabled
  jvm:
    mainClass: org.jetbrains.amper.ktor.ApplicationKt

dependencies:
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.config.yaml
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.server.cors
  - $ktor.client.core
  - $ktor.client.contentNegotiation
  - $ktor.client.java
  - ch.qos.logback:logback-classic:1.5.38

test-dependencies:
  - $ktor.server.testHost
